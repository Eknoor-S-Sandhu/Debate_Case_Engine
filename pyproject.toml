[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "debate-case-engine"
version = "0.1.0"
description = "Local Parliamentary Debate case preparation engine (Phase 1: knowledge and retrieval foundation)"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    # Schemas and configuration
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # Document parsing (Milestone 2)
    "python-docx>=1.1",
    "pypdf>=4.2",
    # Near-duplicate detection (Milestone 5)
    "rapidfuzz>=3.9",
    # Vector store and embeddings (Milestone 7)
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "torch>=2.2",
    # CLI and progress reporting
    "typer>=0.12",
    "tqdm>=4.66",
    # Retrieval testing UI (Milestone 9)
    "streamlit>=1.36",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
include = ["debate_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["debate_engine"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # import sorting
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
]
